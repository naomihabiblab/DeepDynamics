name: dd

channels:
  - conda-forge

dependencies:
  - python=3.11
  - pip
  - numpy=2.3.5
  - pandas=2.3.3
  - scipy=1.16.3
  - scikit-learn=1.8.0
  - h5py=3.15.1
  - matplotlib=3.10.8
  - seaborn=0.13.2
  - statsmodels=0.14.6
  - anndata=0.12.9
  - scanpy=1.11.5
  - xgboost=3.1.3
  - optuna=4.7.0
  - tqdm=4.67.3
  - pip:
      # These are the CUDA 11.8 wheels used in the original dd environment.
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.7.1+cu118
      - torchvision==0.22.1+cu118
      - torchaudio==2.7.1+cu118
      - tabpfn==6.3.2
